
[package]
name = "collisions"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
nalgebra = "0.34.2"
bvh = "0.12.0"
itertools = "0.15.0"
smallvec = "1.15.2"


[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

